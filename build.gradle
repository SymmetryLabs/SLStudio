//     bundleJRE = true
//     javaProperties.put("apple.laf.useScreenMenuBar", "true")
//     jarTask = "shadowJar"
//     javaExtras.put("-XX:+UseParNewGC", null)
//     javaExtras.put("-XX:+UseConcMarkSweepGC", null)
